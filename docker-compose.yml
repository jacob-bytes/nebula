# 星云盘（nebula）—— 单机 Docker Compose 部署
#
#   cp docker/env.example .env    # 填入 JWT_SECRET 等必填项
#   docker compose up -d --build
#
# 说明：
# - 应用镜像内置前端产物，由 NestJS 直接托管，因此不需要额外的 nginx 容器。
# - 数据库迁移由容器 entrypoint 在启动前执行（RUN_MIGRATIONS_ON_START）。
# - 需要 HTTPS/反向代理时，在宿主机前置 Caddy/nginx 并转发到 127.0.0.1:3000；
#   此时应把 CORS_ORIGINS 设为实际对外域名。

name: nebula

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nebula}
      POSTGRES_USER: ${POSTGRES_USER:-nebula}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}
      # 中文排序与大小写比较的稳定默认值；如已有全局设置可按需覆盖
      LANG: C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nebula} -d ${POSTGRES_DB:-nebula}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      # 对外站点地址：分享链接、邮件里的绝对地址都由它拼出；生产环境必填
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # 数据库：容器内固定指向 postgres 服务
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-nebula}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?必须在 .env 中设置 POSTGRES_PASSWORD}
      DB_DATABASE: ${POSTGRES_DB:-nebula}
      DB_MIGRATIONS_RUN: "false"
      # Redis（Bull 队列）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: 0
      # 认证：启动校验会拒绝占位值与低熵值
      JWT_SECRET: ${JWT_SECRET:?必须在 .env 中设置 JWT_SECRET（openssl rand -hex 32）}
      CODE_HMAC_SECRET: ${CODE_HMAC_SECRET:-}
      # 邮件（可选，未配置时注册/找回流程不可用）
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Telegram：文件存储后端
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # 自建 Bot API（可选）：启用 botapi profile 时在 .env 里设置
      #   TELEGRAM_API_BASE=http://bot-api:8081
      #   TELEGRAM_LOCAL_FILE_DIR=/var/lib/telegram-bot-api
      # 两个变量都指向同一份 workdir，后端才能按 file_path 直接读本地文件。
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}
      TELEGRAM_LOCAL_FILE_DIR: ${TELEGRAM_LOCAL_FILE_DIR:-}
      # 日志
      LOG_DIR: tmp/logs
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # 下载缓存、分片临时文件与日志；删除该卷只会丢缓存，不影响对象本体
      - appdata:/app/backend/tmp
      # 与 bot-api 共享的 workdir（只读）。未启用 botapi profile 时该卷为空目录，无副作用。
      # 必须以**相同路径**挂载：本地 Bot API 返回的 file_path 是其容器内绝对路径。
      - botapi-workdir:/var/lib/telegram-bot-api:ro
    ports:
      # 仅绑定本机，公网访问请经由前置反向代理
      - "127.0.0.1:${APP_PORT_HOST:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 下载大文件时容器内并发较高，按部署机内存调整
    stop_grace_period: 30s

  # ---------------------------------------------------------------------------
  # 本地 Telegram Bot API（可选，profile: botapi）
  #
  #   docker compose --profile botapi up -d --build
  #
  # 启用前在 .env 中补三项：
  #   TELEGRAM_API_ID / TELEGRAM_API_HASH   # my.telegram.org 申请，不是 Bot Token
  #   TELEGRAM_API_BASE=http://bot-api:8081
  #   TELEGRAM_LOCAL_FILE_DIR=/var/lib/telegram-bot-api
  #
  # 注意：首次构建会编译 TDLib（约 15–30 分钟，峰值内存约 2GB）。
  # workdir 必须持久化——删掉它会让历史文件的 file_id 全部失效。
  # ---------------------------------------------------------------------------
  bot-api:
    profiles: ["botapi"]
    build:
      context: .
      dockerfile: docker/bot-api.Dockerfile
    environment:
      # 这两个值是 Telegram 的应用凭据，不是 Bot Token；缺失时容器启动即失败
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?启用 botapi profile 前必须在 .env 设置 TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?启用 botapi profile 前必须在 .env 设置 TELEGRAM_API_HASH}
    command:
      - "--api-id=${TELEGRAM_API_ID}"
      - "--api-hash=${TELEGRAM_API_HASH}"
      - "--local"
      - "--http-port=8081"
      - "--dir=/var/lib/telegram-bot-api"
      - "--enable-file-streaming"
    volumes:
      - botapi-workdir:/var/lib/telegram-bot-api
    # 不对外暴露端口：只有 app 通过 compose 内网访问，避免把本地 Bot API 暴露到公网
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appdata:
  botapi-workdir:
